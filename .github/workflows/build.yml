name: build-windows-exe

# Builds the portable single-file bridge .exe on Windows.
# Runs on any tag push (v*) or manually from the Actions tab.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build exe
        run: |
          pip install pyinstaller
          pyinstaller --noconfirm --clean --onefile --name carbonx-bridge entry.py

      - name: Smoke test the exe
        shell: bash
        run: |
          ./dist/carbonx-bridge.exe --version
          ./dist/carbonx-bridge.exe --port 8799 >& exe.log &
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:8799/health > /dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:8799/health
          kill %1 || true

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: carbonx-bridge-windows
          path: dist/carbonx-bridge.exe
          if-no-files-found: error

      - name: Attach to GitHub release (tagged builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/carbonx-bridge.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}